name: Build osu! APK

on:
  push:
    branches: [ master, main, add-mod-menu ]
  pull_request:
    branches: [ master, main, add-mod-menu ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build osu! Android with Gradle
      run: |
        ./gradlew clean
        ./gradlew :osu.Android:assembleDebug
      continue-on-error: true

    - name: Find APK files
      run: |
        find . -name "*.apk" -type f
        ls -la osu.Android/build/outputs/apk/ 2>/dev/null || echo "Build directory not found"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: osu-android-debug
        path: osu.Android/build/outputs/apk/**/app-debug.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: osu! Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Build Status
      if: always()
      run: |
        echo "Build Status: ${{ job.status }}"
        echo "APK ready for download in Artifacts"
